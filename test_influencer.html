<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFINITH — Influencer Search (Featuring Style)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }

  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  input, select { padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 13px; outline: none; }
  input:focus { border-color: #6366f1; }
  .btn { padding: 9px 20px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #6366f1; color: white; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-green { background: #22c55e20; color: #22c55e; }
  .badge-blue { background: #6366f120; color: #6366f1; }
  .badge-purple { background: #8b5cf620; color: #8b5cf6; }
  .badge-yellow { background: #eab30820; color: #eab308; }
  .badge-red { background: #ef444420; color: #ef4444; }

  /* Tag Input */
  .tag-group { margin-bottom: 14px; }
  .tag-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
  .tag-group .desc { font-size: 11px; color: #475569; font-weight: 400; margin-left: 8px; }
  .tag-container { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; min-height: 38px; }
  .tag-container:focus-within { border-color: #6366f1; }
  .tag { display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .tag-include { background: #6366f130; color: #a5b4fc; border: 1px solid #6366f150; }
  .tag-exclude { background: #ef444420; color: #fca5a5; border: 1px solid #ef444440; }
  .tag .remove { cursor: pointer; font-size: 14px; opacity: 0.6; }
  .tag .remove:hover { opacity: 1; }
  .tag-input { border: none; background: transparent; color: #e2e8f0; font-size: 13px; outline: none; flex: 1; min-width: 120px; padding: 4px 0; }

  /* Suggestions */
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .suggestion { padding: 4px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; background: #334155; color: #94a3b8; border: 1px solid transparent; }
  .suggestion:hover { border-color: #6366f1; color: #e2e8f0; }

  /* Checkbox */
  .check-group { display: flex; gap: 16px; margin: 12px 0; }
  .check-item { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .check-item input[type=checkbox] { accent-color: #6366f1; }

  /* Filter Row */
  .filter-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-top: 12px; }

  /* Influencer Grid */
  .inf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .inf-card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; transition: all 0.2s; cursor: pointer; }
  .inf-card:hover { border-color: #6366f1; transform: translateY(-2px); box-shadow: 0 4px 20px #6366f115; }
  .inf-header { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .inf-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #334155; flex-shrink: 0; }
  .inf-name { font-weight: 600; font-size: 14px; }
  .inf-handle { font-size: 12px; color: #94a3b8; }
  .inf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
  .inf-stat { text-align: center; background: #0f172a; border-radius: 6px; padding: 6px 4px; }
  .inf-stat-value { font-size: 14px; font-weight: 700; }
  .inf-stat-label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 0.3px; }
  .inf-bio { font-size: 11px; color: #94a3b8; line-height: 1.5; max-height: 33px; overflow: hidden; }
  .inf-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #0f172a; }
  .eng-good { color: #22c55e; }
  .eng-mid { color: #eab308; }
  .eng-low { color: #ef4444; }

  /* Detail Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #0f172aee; z-index: 100; overflow-y: auto; }
  .modal-overlay.active { display: block; }
  .modal { max-width: 800px; margin: 40px auto; background: #1e293b; border-radius: 16px; padding: 28px; }
  .modal-close { float: right; font-size: 24px; cursor: pointer; color: #64748b; }
  .modal-close:hover { color: #e2e8f0; }
  .detail-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 16px 0; }
  .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 12px; }
  .post-item { background: #0f172a; border-radius: 8px; padding: 10px; font-size: 11px; }

  .loading { text-align: center; padding: 40px; color: #6366f1; }
  .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>

<div class="container">
  <h1>Influencer Search</h1>
  <p class="subtitle">키워드 기반 인플루언서 검색 — 콘텐츠/프로필 매칭 + 필터링</p>

  <!-- Search Card -->
  <div class="card">
    <!-- 포함 키워드 -->
    <div class="tag-group">
      <label>포함 키워드 설정 (최대 3개)</label>
      <div class="tag-container" id="includeContainer" onclick="this.querySelector('input')?.focus()">
        <input class="tag-input" id="includeInput" placeholder="키워드 입력 후 Enter" maxlength="30"
               onkeydown="handleTagInput(event, 'include', 3)">
      </div>
      <div class="suggestions">
        <span style="font-size:11px;color:#475569">추천:</span>
        <span class="suggestion" onclick="addTag('include','성형후기')">성형후기</span>
        <span class="suggestion" onclick="addTag('include','코성형')">코성형</span>
        <span class="suggestion" onclick="addTag('include','눈성형')">눈성형</span>
        <span class="suggestion" onclick="addTag('include','피부관리')">피부관리</span>
        <span class="suggestion" onclick="addTag('include','뷰티')">뷰티</span>
        <span class="suggestion" onclick="addTag('include','리프팅')">리프팅</span>
        <span class="suggestion" onclick="addTag('include','강남성형외과')">강남성형외과</span>
      </div>
    </div>

    <!-- 검색 영역 선택 -->
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="searchContent" checked> 콘텐츠에서 검색 <span style="font-size:10px;color:#475569">(게시물 캡션)</span></label>
      <label class="check-item"><input type="checkbox" id="searchProfile" checked> 프로필에서 검색 <span style="font-size:10px;color:#475569">(바이오)</span></label>
    </div>

    <!-- 제외 키워드 -->
    <div class="tag-group">
      <label>제외 키워드 (최대 3개) <span class="desc">게시물/바이오에 포함된 인플루언서 제외</span></label>
      <div class="tag-container" id="excludeContainer" onclick="this.querySelector('input')?.focus()">
        <input class="tag-input" id="excludeInput" placeholder="예: 광고대행, 부계정, 팬계정" maxlength="30"
               onkeydown="handleTagInput(event, 'exclude', 3)">
      </div>
    </div>

    <!-- 계정명 제외 -->
    <div class="tag-group">
      <label>계정명에서 제외 (최대 5개) <span class="desc">계정명/이름에 키워드 포함 인플루언서 제외</span></label>
      <div class="tag-container" id="excludeAccountContainer" onclick="this.querySelector('input')?.focus()">
        <input class="tag-input" id="excludeAccountInput" placeholder="예: official, .com, _ad" maxlength="30"
               onkeydown="handleTagInput(event, 'excludeAccount', 5)">
      </div>
    </div>

    <!-- 팔로워 필터 + 검색 버튼 -->
    <div class="filter-row">
      <div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">최소 팔로워</div>
        <select id="minFollowers">
          <option value="500">500+</option>
          <option value="1000" selected>1,000+</option>
          <option value="5000">5,000+</option>
          <option value="10000">10,000+</option>
          <option value="50000">50,000+</option>
        </select>
      </div>
      <div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">최대 팔로워</div>
        <select id="maxFollowers">
          <option value="0" selected>제한 없음</option>
          <option value="10000">~10,000</option>
          <option value="50000">~50,000</option>
          <option value="100000">~100,000</option>
          <option value="500000">~500,000</option>
        </select>
      </div>
      <div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">수집 게시물 수</div>
        <select id="resultsLimit">
          <option value="20">20개 (빠름)</option>
          <option value="30" selected>30개</option>
          <option value="50">50개 (느림)</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnSearch" onclick="doSearch()" style="margin-left:auto">
        검색
      </button>
    </div>
  </div>

  <!-- Results -->
  <div id="resultSection" style="display:none">
    <div class="result-bar" id="resultBar"></div>
    <div id="resultGrid"></div>
  </div>

  <!-- Profile Detail -->
  <div id="profileSection" style="display:none">
    <div style="margin-bottom:12px">
      <button class="btn" style="background:#334155;color:#94a3b8" onclick="backToList()">← 목록으로</button>
    </div>
    <div id="profileContent"></div>
  </div>

  <div style="font-size:11px;color:#475569;margin-top:16px">
    API: <input type="text" id="apiBase" value="http://localhost:8000" style="width:200px;font-size:11px;padding:3px 6px">
  </div>
</div>

<script>
const API = () => document.getElementById('apiBase').value.trim();
const tags = { include: [], exclude: [], excludeAccount: [] };
let lastSearchResult = null; // 검색 결과 캐시

function backToList() {
  document.getElementById('profileSection').style.display = 'none';
  document.getElementById('resultSection').style.display = 'block';
}

function handleTagInput(e, type, max) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const input = e.target;
  const val = input.value.trim().replace('#','');
  if (val) addTag(type, val);
  input.value = '';
}

function addTag(type, value) {
  const max = type === 'excludeAccount' ? 5 : 3;
  if (tags[type].length >= max || tags[type].includes(value)) return;
  tags[type].push(value);
  renderTags(type);
}

function removeTag(type, idx) {
  tags[type].splice(idx, 1);
  renderTags(type);
}

function renderTags(type) {
  const containerId = type === 'include' ? 'includeContainer' :
                      type === 'exclude' ? 'excludeContainer' : 'excludeAccountContainer';
  const container = document.getElementById(containerId);
  const input = container.querySelector('input');
  const cls = type === 'include' ? 'tag-include' : 'tag-exclude';

  // 기존 태그 제거
  container.querySelectorAll('.tag').forEach(t => t.remove());

  // 태그 렌더링
  tags[type].forEach((t, i) => {
    const el = document.createElement('span');
    el.className = `tag ${cls}`;
    el.innerHTML = `${t} <span class="remove" onclick="removeTag('${type}',${i})">×</span>`;
    container.insertBefore(el, input);
  });
}

function proxyImg(url) {
  if (!url) return '';
  return `${API()}/api/influencers/proxy/image?url=${encodeURIComponent(url)}`;
}

function formatNum(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function engClass(rate) {
  return rate >= 3 ? 'eng-good' : (rate >= 1 ? 'eng-mid' : 'eng-low');
}

function renderTable(data) {
  if (!data.length) return '<div style="text-align:center;padding:40px;color:#64748b">검색 결과가 없습니다.</div>';
  let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr style="border-bottom:1px solid #334155">
      <th style="text-align:left;padding:10px 8px;color:#64748b;font-size:11px;font-weight:600">계정</th>
      <th style="text-align:left;padding:10px 8px;color:#64748b;font-size:11px">카테고리</th>
      <th style="text-align:right;padding:10px 8px;color:#64748b;font-size:11px">최근 업로드</th>
      <th style="text-align:right;padding:10px 8px;color:#64748b;font-size:11px">팔로워 수</th>
      <th style="text-align:right;padding:10px 8px;color:#64748b;font-size:11px">예상 유효 팔로워</th>
      <th style="text-align:right;padding:10px 8px;color:#64748b;font-size:11px">ER</th>
      <th style="text-align:right;padding:10px 8px;color:#64748b;font-size:11px">예상 평균 도달</th>
    </tr></thead><tbody>`;

  data.forEach(inf => {
    const er = inf.engagement_rate || 0;
    const handle = (inf.handle || '').replace('@','');
    const cats = (inf.categories || []).map(c => `<span class="badge badge-purple" style="margin-right:2px">${c}</span>`).join('');
    html += `<tr style="border-bottom:1px solid #1e293b;cursor:pointer" onclick="showProfile('${handle}')" onmouseenter="this.style.background='#1e293b'" onmouseleave="this.style.background='transparent'">
      <td style="padding:10px 8px">
        <div style="display:flex;align-items:center;gap:10px">
          ${inf.profile_pic_url ? `<img src="${proxyImg(inf.profile_pic_url)}" style="width:36px;height:36px;border-radius:50%;flex-shrink:0">` : '<div style="width:36px;height:36px;border-radius:50%;background:#334155;flex-shrink:0"></div>'}
          <div>
            <div style="font-weight:600;font-size:13px">${handle}</div>
            <div style="font-size:11px;color:#64748b">${inf.full_name || ''}</div>
          </div>
        </div>
      </td>
      <td style="padding:10px 8px">${cats}</td>
      <td style="padding:10px 8px;text-align:right;color:#94a3b8;font-size:12px">${inf.last_upload || '—'}</td>
      <td style="padding:10px 8px;text-align:right;font-weight:600">${formatNum(inf.followers)}</td>
      <td style="padding:10px 8px;text-align:right;color:#94a3b8">${formatNum(inf.estimated_real_followers || 0)}</td>
      <td style="padding:10px 8px;text-align:right"><span class="${engClass(er)}" style="font-weight:600">${er.toFixed(2)}%</span></td>
      <td style="padding:10px 8px;text-align:right;color:#94a3b8">${formatNum(inf.estimated_reach || 0)}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  return html;
}

async function doSearch() {
  if (!tags.include.length) { alert('포함 키워드를 1개 이상 입력하세요'); return; }

  const btn = document.getElementById('btnSearch');
  btn.disabled = true; btn.textContent = '검색 중...';
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('profileSection').style.display = 'none';
  document.getElementById('resultGrid').innerHTML = `<div class="loading" style="grid-column:1/-1"><div class="spinner"></div><div>키워드 기반 인플루언서 검색 중...</div><div style="font-size:11px;color:#475569;margin-top:4px">해시태그 게시물 수집 → 작성자 추출 → 프로필 분석 → 필터링 (약 60~120초)</div></div>`;

  try {
    const resp = await fetch(`${API()}/api/influencers/search`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        keywords: tags.include,
        exclude_keywords: tags.exclude,
        exclude_accounts: tags.excludeAccount,
        search_in_content: document.getElementById('searchContent').checked,
        search_in_profile: document.getElementById('searchProfile').checked,
        min_followers: parseInt(document.getElementById('minFollowers').value),
        max_followers: parseInt(document.getElementById('maxFollowers').value),
        results_limit: parseInt(document.getElementById('resultsLimit').value),
      }),
    });
    const data = await resp.json();
    if (data.success) {
      document.getElementById('resultBar').innerHTML = `
        <span>키워드 <strong style="color:#e2e8f0">${data.keywords.map(k=>'#'+k).join(' ')}</strong> · <strong style="color:#e2e8f0">${data.count}명</strong> 발견</span>
        <span style="font-size:11px">팔로워 ${formatNum(data.filters.min_followers)}${data.filters.max_followers ? '~'+formatNum(data.filters.max_followers) : '+'}</span>
      `;
      document.getElementById('resultGrid').innerHTML = renderTable(data.data);
    } else {
      document.getElementById('resultGrid').innerHTML = `<div style="grid-column:1/-1;color:#ef4444;padding:20px">${data.message}</div>`;
    }
  } catch(e) {
    document.getElementById('resultGrid').innerHTML = `<div style="grid-column:1/-1;color:#ef4444;padding:20px">연결 실패: ${e.message}<br><span style="font-size:11px">uvicorn app.main:app --port 8000</span></div>`;
  }
  btn.disabled = false; btn.textContent = '검색';
}

async function showProfile(handle) {
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('profileSection').style.display = 'block';
  window.scrollTo(0, 0);
  const el = document.getElementById('profileContent');
  el.innerHTML = `<div class="loading"><div class="spinner"></div><div>@${handle} 상세 분석 중... (게시물+릴스 수집)</div></div>`;

  try {
    const resp = await fetch(`${API()}/api/influencers/profile`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({handle}),
    });
    const data = await resp.json();
    if (data.success) {
      el.innerHTML = renderProfile(data.data);
    } else {
      el.innerHTML = `<div class="card"><p style="color:#ef4444">${data.message}</p></div>`;
    }
  } catch(e) {
    el.innerHTML = `<div class="card"><p style="color:#ef4444">${e.message}</p></div>`;
  }
}

function renderProfile(d) {
  const er = d.engagement_rate || 0;
  let html = `<div class="card">
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">
      ${d.profile_pic_url ? `<img src="${proxyImg(d.profile_pic_url)}" style="width:72px;height:72px;border-radius:50%">` : ''}
      <div>
        <h2 style="font-size:20px">${d.full_name || d.handle} ${d.is_verified ? '<span class="badge badge-blue">Verified</span>' : ''} ${d.is_business ? '<span class="badge badge-green">Business</span>' : ''}</h2>
        <div style="color:#94a3b8;font-size:14px">@${d.handle}</div>
        ${(d.categories||[]).length ? d.categories.map(c=>`<span class="badge badge-purple" style="margin-top:4px">${c}</span>`).join(' ') : (d.category ? `<span class="badge badge-purple" style="margin-top:4px">${d.category}</span>` : '')}
      </div>
    </div>
    ${d.bio ? `<p style="font-size:13px;color:#94a3b8;line-height:1.7;margin-bottom:16px">${d.bio}</p>` : ''}
    ${d.external_url ? `<a href="${d.external_url}" target="_blank" style="color:#6366f1;font-size:12px">${d.external_url}</a>` : ''}
    <div class="detail-stats">
      <div class="inf-stat"><div class="inf-stat-value">${formatNum(d.followers)}</div><div class="inf-stat-label">팔로워</div></div>
      <div class="inf-stat"><div class="inf-stat-value">${formatNum(d.following)}</div><div class="inf-stat-label">팔로잉</div></div>
      <div class="inf-stat"><div class="inf-stat-value">${formatNum(d.posts || 0)}</div><div class="inf-stat-label">게시물</div></div>
      <div class="inf-stat"><div class="inf-stat-value ${engClass(er)}">${er.toFixed(2)}%</div><div class="inf-stat-label">인게이지먼트</div></div>
      <div class="inf-stat"><div class="inf-stat-value">${formatNum(d.avg_reel_plays || 0)}</div><div class="inf-stat-label">릴스 평균 재생</div></div>
    </div>
    <div style="display:flex;gap:20px;margin-top:8px;font-size:13px;color:#94a3b8">
      <span>평균 좋아요 <strong style="color:#ef4444">${formatNum(d.avg_likes||0)}</strong></span>
      <span>평균 댓글 <strong style="color:#6366f1">${formatNum(d.avg_comments||0)}</strong></span>
    </div>
  </div>`;

  if (d.recent_posts?.length) {
    html += `<div class="card"><h3 style="font-size:14px;margin-bottom:12px">최근 게시물 (${d.recent_posts.length}개)</h3><div class="posts-grid">`;
    d.recent_posts.forEach(p => {
      html += `<div class="post-item">
        <div style="margin-bottom:6px;color:#94a3b8;max-height:44px;overflow:hidden;line-height:1.5">${p.caption || '(캡션 없음)'}</div>
        <div style="display:flex;gap:10px;font-size:11px">
          <span style="color:#ef4444">${formatNum(p.likes||0)} ♥</span>
          <span style="color:#6366f1">${formatNum(p.comments||0)} 💬</span>
          ${p.video_views ? `<span style="color:#8b5cf6">${formatNum(p.video_views)} ▶</span>` : ''}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  if (d.recent_reels?.length) {
    html += `<div class="card"><h3 style="font-size:14px;margin-bottom:12px">최근 릴스 (${d.recent_reels.length}개)</h3><div class="posts-grid">`;
    d.recent_reels.forEach(r => {
      html += `<div class="post-item">
        <div style="margin-bottom:6px;color:#94a3b8;max-height:44px;overflow:hidden;line-height:1.5">${r.caption || '(캡션 없음)'}</div>
        <div style="display:flex;gap:10px;font-size:11px">
          <span style="color:#8b5cf6">${formatNum(r.plays||0)} ▶</span>
          <span style="color:#ef4444">${formatNum(r.likes||0)} ♥</span>
          ${r.duration ? `<span style="color:#94a3b8">${r.duration}s</span>` : ''}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  return html;
}
</script>
</body>
</html>
